report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/ezflux/tree/dev" target="_blank">nf-core/ezflux</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/ezflux/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-ezflux-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-ezflux-summary":
    order: -1002
  found_fraction:
    order: 100
  growth_rates:
    order: 90
  import_niche:
    order: 80
  export_niche:
    order: 70

# Static plots written by MICOM_MERGE (<id>_mqc.png are picked up as custom-content images)
custom_data:
  found_fraction:
    section_name: "MICOM: model database coverage"
    description: "Share of each community that was matched to a model in the model database: by number of taxa and by abundance. Samples with little abundance matched (dotted line: 50%) are poorly represented by the models."
  growth_rates:
    section_name: "MICOM: growth rates"
    description: "Growth rate of every taxon in every sample (and medium), as drawn by <code>micom.viz.plot_growth</code>. Interactive version: <code>merged/ezflux.growth_rates.html</code>."
  import_niche:
    section_name: "MICOM: import niches"
    description: "UMAP of the imported metabolite fluxes per taxon (<code>plot_exchanges_per_taxon</code>, direction import). Interactive version: <code>merged/ezflux.import_niche.html</code>."
  export_niche:
    section_name: "MICOM: export niches"
    description: "UMAP of the exported metabolite fluxes per taxon (<code>plot_exchanges_per_taxon</code>, direction export). Interactive version: <code>merged/ezflux.export_niche.html</code>."

export_plots: true

disable_version_detection: true
