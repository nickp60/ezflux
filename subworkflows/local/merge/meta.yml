# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# Typed subworkflow (Nextflow 26.10 syntax)
name: "merge"
description: 'Merges all growth results, exports the tables and draws the plots.'
keywords:
  - micom
  - plots
components:
  - micom/merge
input:
  - growth_zips:
      type: channel
      description: 'one GrowthResults zip per item (per sample and medium, or the merged zip of an earlier run)'
  - build_manifests:
      type: channel
      description: 'build manifests matching the zips; may be empty (the found fraction table is then empty)'
output:
  - plots:
      type: channel
      description: 'static *_mqc.png plots for MultiQC'
authors:
  - "@watersn"
maintainers:
  - "@watersn"
